version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # These versions need compileSdk 37; the project stays on android-36 until
      # docs/tasks/blocked/compile-sdk-37.md is done.
      - dependency-name: androidx.compose:compose-bom
        versions: ["[2026.08.00,)"]
      - dependency-name: com.squareup.okhttp3:okhttp
        versions: ["[5.5.0,)"]
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

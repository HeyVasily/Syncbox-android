name: Dependency audit

# Runs when dependency manifests or bridge code change, in a pull request or on master.
# New advisories appear without any change in the repository, so it also runs on a schedule.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/go.mod'
      - 'engine/**/*.go'
      - '**/gradle.lockfile'
      - '**/buildscript-gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'osv-scanner.toml'
      - 'dev/audit-deps.sh'
      - 'dev/pinned-tool.sh'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches:
      - master
    paths:
      - '**/go.mod'
      - 'engine/**/*.go'
      - '**/gradle.lockfile'
      - '**/buildscript-gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'osv-scanner.toml'
      - 'dev/audit-deps.sh'
      - 'dev/pinned-tool.sh'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Audit dependencies
        run: bash dev/audit-deps.sh

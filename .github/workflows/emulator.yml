name: Emulator

# Instrumented tests on an emulator, about 5 minutes per job. Runs weekly, on demand, on pushes to
# master, and on pull requests that change the app, the bridge, their build (Gradle files,
# wrapper, build scripts, NDK install) or dependencies, or the instrumented tests and how they
# run; not on pull requests that change only docs or other checks.
on:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/emulator.yml'
      - 'dev/instrumented-tests.sh'
      - 'dev/build-app.sh'
      - 'dev/build-bridge.sh'
      - 'dev/install-ndk.sh'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
      - 'app/src/debug/**'
      - 'app/src/androidTest/**'
      - 'engine/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/verification-metadata.xml'

permissions:
  contents: read

# A new push to a pull request replaces its running check. Every other run is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests (API ${{ matrix.api }}, ${{ matrix.page-size }} B pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk, standard 4 KB pages.
          - api: 34
            target: google_apis
            page-size: 4096
          # targetSdk with 16 KB pages: the bridge must load without page size compatibility mode.
          - api: 36
            target: google_apis_ps16k
            page-size: 16384
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Install the NDK
        run: bash dev/install-ndk.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Built before the emulator starts, so the emulator runs only the tests.
      - name: Build the app and its test APK
        run: bash gradlew --no-daemon --dependency-verification strict assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECT_PAGE_SIZE: ${{ matrix.page-size }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          script: bash dev/instrumented-tests.sh --device
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-api${{ matrix.api }}-${{ github.run_attempt }}
          path: .build/instrumented/
          retention-days: 7
          if-no-files-found: ignore
